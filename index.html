<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sito ufficiale di Professor Quasì Games e Quasì Sudoku.">
  <title>Professor Quasì Games</title>
  <style>
    :root { color-scheme: light; --ink:#183946; --teal:#176f6b; --gold:#c69a3c; --paper:#f7f2e7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; color:var(--ink); background:radial-gradient(circle at 50% 10%,#fff 0,#f7f2e7 42%,#dcebe7 100%); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(680px,100%); padding:42px 28px; text-align:center; background:rgba(255,255,255,.86); border:2px solid rgba(23,111,107,.22); border-radius:32px; box-shadow:0 20px 55px rgba(24,57,70,.14); }
    .mark { width:112px; height:112px; margin:auto; display:grid; place-items:center; border:7px solid var(--gold); border-radius:50%; color:#fff; background:var(--teal); font:700 62px Georgia,serif; }
    h1 { margin:24px 0 8px; font-size:clamp(34px,7vw,52px); }
    h2 { margin:0; color:var(--teal); font-size:22px; }
    p { max-width:520px; margin:22px auto; line-height:1.6; }
    nav { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:28px; }
    a { display:inline-block; padding:14px 22px; border-radius:999px; color:#fff; background:var(--teal); font-weight:700; text-decoration:none; }
    a.secondary { color:var(--ink); background:#fff; border:2px solid rgba(24,57,70,.2); }
    footer { margin-top:34px; color:#60767b; font-size:14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Q</div>
    <h1>Professor Quasì</h1>
    <h2>Con Quasì non si indovina. Si ragiona.</h2>
    <p><strong>Quasì Sudoku</strong> è un gioco di logica con livelli progressivi, sfida quotidiana, statistiche e gli aiuti ragionati del Professor Quasì.</p>
    <nav>
      <a href="https://play.google.com/store/apps/details?id=com.professorquasi.sudoku">Scarica da Google Play</a>
      <a class="secondary" href="https://sites.google.com/view/professorquasigames/home-page">Privacy e assistenza</a>
    </nav>
    <footer>© Professor Quasì Games</footer>
  </main>
</body>
</html>
